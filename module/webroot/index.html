<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>phDroid</title>
<style>
  :root{
    --bg:#0f1115; --card:#171a21; --line:#262b35; --fg:#e8ecf2; --dim:#96a0b5;
    --accent:#5b8cff; --ok:#3ddc97; --bad:#ff6b6b; --warn:#ffb020;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f4f6fa; --card:#ffffff; --line:#e3e8f0; --fg:#151a22; --dim:#5d6a80;
           --accent:#2f6bed; --ok:#0f9d63; --bad:#d93a3a; --warn:#b46b00; }
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:var(--bg);color:var(--fg);
    font:15px/1.5 "SF Pro Text",Roboto,"PingFang SC","Noto Sans CJK SC",sans-serif;
    padding:calc(18px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
  }
  h1{font-size:19px;margin:0 0 2px;letter-spacing:.2px}
  .sub{color:var(--dim);font-size:12.5px;margin-bottom:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
  .row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:6px 0}
  .row+.row{border-top:1px solid var(--line)}
  .k{color:var(--dim);font-size:13.5px}
  .v{font-variant-numeric:tabular-nums;font-size:13.5px;text-align:right;word-break:break-all}
  .badge{font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--dim)}
  .badge.on{color:var(--ok);border-color:var(--ok)}
  .badge.off{color:var(--bad);border-color:var(--bad)}
  .badge.warn{color:var(--warn);border-color:var(--warn)}
  .actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:14px 0}
  button{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--fg);
         border-radius:11px;padding:11px 8px;font-size:13.5px;font-weight:500}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button:disabled{opacity:.45}
  button:active{opacity:.72}
  h2{font-size:12px;color:var(--dim);font-weight:600;letter-spacing:.4px;margin:18px 0 8px;text-transform:uppercase}
  .params{font:12px/1.7 ui-monospace,Menlo,Consolas,monospace;color:var(--dim);white-space:pre-wrap;word-break:break-all}
  pre{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0;
      font:12px/1.55 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-word;
      color:var(--fg);max-height:52vh;overflow:auto}
</style>
</head>
<body>
  <h1>phDroid</h1>
  <div class="sub">droid_lkm · KallRecon + HooKern + Type_info</div>

  <div class="card">
    <div class="row"><span class="k">droid_lkm</span><span id="state" class="badge">读取中</span></div>
    <div class="row"><span class="k">内核</span><span id="kernel" class="v">–</span></div>
    <div class="row"><span class="k">构建 KMI</span><span id="kmi" class="v">–</span></div>
    <div class="row"><span class="k">加载阻断</span><span id="blocked" class="badge">–</span></div>
  </div>

  <div class="actions">
    <button id="btn-refresh">刷新</button>
    <button id="btn-load" class="primary">重试加载</button>
    <button id="btn-log">清空日志</button>
  </div>

  <h2>参数</h2>
  <div class="card params" id="params">–</div>

  <h2>日志</h2>
  <pre id="log">正在读取…</pre>

<script>
(function () {
  var M = "/data/adb/modules/phdroid";
  var busy = false;

  var STATUS = [
    "M=" + M,
    'echo "version=$(sed -n \'s/^version=//p\' $M/module.prop 2>/dev/null)"',
    'echo "kernel=$(uname -r)"',
    'echo "kmi=$(cat $M/kmi 2>/dev/null)"',
    'echo "loaded=$(grep -c \'^droid_lkm \' /proc/modules 2>/dev/null)"',
    'echo "compat=$(grep -c \'^droid_lkm_compat \' /proc/modules 2>/dev/null)"',
    'echo "blocked=$([ -f $M/blocked ] && echo 1 || echo 0)"',
    'echo "===params==="',
    'for p in /sys/module/droid_lkm/parameters/*; do [ -f "$p" ] && echo "${p##*/}=$(cat "$p")"; done',
    'echo "===log==="',
    'tail -n 30 $M/phdroid.log 2>/dev/null'
  ].join("\n");

  // KernelSU / APatch 注入 window.ksu.exec(command, optionsJson, callback)
  // 老版本也可能直接返回 Promise，两种都兜住
  function sh(cmd) {
    return new Promise(function (resolve) {
      var k = window.ksu;
      if (!k || typeof k.exec !== "function") {
        resolve({ errno: -1, stdout: "", stderr: "当前环境没有 WebUI API" });
        return;
      }
      var settled = false;
      function done(errno, stdout, stderr) {
        if (settled) return;
        settled = true;
        resolve({ errno: errno | 0, stdout: stdout || "", stderr: stderr || "" });
      }
      try {
        var r = k.exec(cmd, "{}", function (e, o, s) { done(e, o, s); });
        if (r && typeof r.then === "function") {
          r.then(function (v) { done(v.errno, v.stdout, v.stderr); })
           .catch(function (e) { done(-1, "", String(e)); });
        }
      } catch (e) {
        done(-1, "", String(e));
      }
      setTimeout(function () { done(-1, "", "timeout"); }, 20000);
    });
  }

  function kv(text) {
    var map = {};
    (text || "").split("\n").forEach(function (line) {
      var i = line.indexOf("=");
      if (i > 0) map[line.slice(0, i)] = line.slice(i + 1).trim();
    });
    return map;
  }

  function render(text) {
    var parts = text.split("===params===");
    var head = kv(parts[0] || "");
    var rest = (parts[1] || "").split("===log===");

    var st = document.getElementById("state");
    var loaded = head.loaded === "1";
    var blocked = head.blocked === "1";

    st.textContent = loaded ? "已加载" : (blocked ? "已阻断" : "未加载");
    st.className = "badge " + (loaded ? "on" : (blocked ? "warn" : "off"));

    document.getElementById("kernel").textContent = head.kernel || "–";
    document.getElementById("kmi").textContent = head.kmi || "–";

    var b = document.getElementById("blocked");
    b.textContent = blocked ? "是（上次 insmod 崩溃）" : "否";
    b.className = "badge " + (blocked ? "warn" : "on");

    document.getElementById("params").textContent = (rest[0] || "").trim() || "（模块未加载）";
    document.getElementById("log").textContent = (rest[1] || "").trim() || "（空）";
  }

  function setButtons(on) {
    ["btn-refresh", "btn-load", "btn-log"].forEach(function (id) {
      document.getElementById(id).disabled = !on;
    });
  }

  function loadStatus() {
    if (busy) return;
    busy = true;
    setButtons(false);
    sh(STATUS).then(function (r) {
      busy = false;
      setButtons(true);
      render((r.stdout || "") + (r.stderr ? "\n" + r.stderr : ""));
    });
  }

  document.getElementById("btn-refresh").onclick = function () {
    loadStatus();
  };

  document.getElementById("btn-load").onclick = function () {
    if (busy) return;
    busy = true;
    setButtons(false);
    document.getElementById("log").textContent = "解除阻断并重新加载 …";
    // 先清掉崩溃闸门，再走和开机完全相同的加载脚本
    sh("M=" + M + "; rm -f $M/blocked $M/insmod.crash; sh $M/service.sh; echo done")
      .then(function () {
        busy = false;
        setButtons(true);
        loadStatus();
      });
  };

  document.getElementById("btn-log").onclick = function () {
    if (busy) return;
    busy = true;
    setButtons(false);
    sh(": > " + M + "/phdroid.log; echo cleared").then(function () {
      busy = false;
      setButtons(true);
      loadStatus();
    });
  };

  loadStatus();
})();
</script>
</body>
</html>
