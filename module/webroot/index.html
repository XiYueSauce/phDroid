<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>phDroid</title>
<style>
  :root{
    --bg:#0f1115; --card:#171a21; --line:#262b35; --fg:#e8ecf2; --dim:#96a0b5;
    --accent:#5b8cff; --ok:#3ddc97; --bad:#ff6b6b; --warn:#ffb020;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f4f6fa; --card:#ffffff; --line:#e3e8f0; --fg:#151a22; --dim:#5d6a80;
           --accent:#2f6bed; --ok:#0f9d63; --bad:#d93a3a; --warn:#b46b00; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:15px/1.5 "SF Pro Text",Roboto,"PingFang SC","Noto Sans CJK SC",sans-serif;
    padding:calc(18px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));}
  h1{font-size:19px;margin:0 0 2px;letter-spacing:.2px}
  .sub{color:var(--dim);font-size:12.5px;margin-bottom:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
  .row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:6px 0}
  .row+.row{border-top:1px solid var(--line)}
  .k{color:var(--dim);font-size:13.5px;flex:0 0 auto}
  .v{font-variant-numeric:tabular-nums;font-size:13.5px;text-align:right;word-break:break-all}
  .badge{font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--dim);white-space:nowrap}
  .badge.on{color:var(--ok);border-color:var(--ok)}
  .badge.off{color:var(--bad);border-color:var(--bad)}
  .badge.warn{color:var(--warn);border-color:var(--warn)}
  .actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:14px 0}
  button{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--fg);
         border-radius:11px;padding:11px 8px;font-size:13.5px;font-weight:500}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button:disabled{opacity:.45}
  button:active{opacity:.72}
  h2{font-size:12px;color:var(--dim);font-weight:600;letter-spacing:.4px;margin:18px 0 8px;text-transform:uppercase}
  .params{font:12px/1.7 ui-monospace,Menlo,Consolas,monospace;color:var(--dim);white-space:pre-wrap;word-break:break-all}
  pre{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0;
      font:12px/1.55 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-word;
      color:var(--fg);max-height:52vh;overflow:auto}
</style>
</head>
<body>
  <h1>phDroid</h1>
  <div class="sub" id="sub">droid_lkm · KallRecon + HooKern + Type_info</div>

  <div class="card">
    <div class="row"><span class="k">droid_lkm</span><span id="state" class="badge">读取中</span></div>
    <div class="row"><span class="k">内核</span><span id="kernel" class="v">–</span></div>
    <div class="row"><span class="k">构建 KMI</span><span id="kmi" class="v">–</span></div>
    <div class="row"><span class="k">设备</span><span id="device" class="v">–</span></div>
    <div class="row"><span class="k">一加 / OPPO</span><span id="oplus" class="badge">–</span></div>
    <div class="row"><span class="k">兼容模块</span><span id="compat" class="badge">–</span></div>
    <div class="row"><span class="k">加载阻断</span><span id="blocked" class="badge">–</span></div>
  </div>

  <div class="actions">
    <button id="btn-refresh">刷新</button>
    <button id="btn-load" class="primary">重试加载</button>
    <button id="btn-log">清空日志</button>
  </div>

  <h2>参数</h2>
  <div class="card params" id="params">–</div>

  <h2>日志</h2>
  <pre id="log">正在读取…</pre>

<script>
(function () {
  var M = "/data/adb/modules/phdroid";
  var CMD_STATUS = "sh " + M + "/service.sh status";
  var busy = false;
  var cbSeq = 0;

  // KernelSU 的 ksu.exec 签名是 exec(command, optionsJson, callbackName)，
  // 第三个参数是回调函数名（字符串），由 JSBridge 回头调用 window[名字]。
  // 直接传函数不会触发，WebUI 会一直停在“读取中”。
  function sh(cmd) {
    return new Promise(function (resolve) {
      if (!window.ksu || typeof window.ksu.exec !== "function") {
        resolve({ errno: -1, stdout: "", stderr: "当前环境没有 WebUI API（需要 KernelSU / APatch）" });
        return;
      }
      var name = "ph_cb_" + Date.now() + "_" + (cbSeq++);
      var done = false;
      function finish(errno, stdout, stderr) {
        if (done) return;
        done = true;
        resolve({ errno: errno | 0, stdout: stdout || "", stderr: stderr || "" });
      }
      window[name] = finish;
      try {
        window.ksu.exec(cmd, "{}", name);
      } catch (e) {
        finish(-1, "", String(e));
      }
      setTimeout(function () { finish(-1, "", "执行超时（8s）"); }, 8000);
    });
  }

  function parse(text) {
    var idx = text.indexOf("---log---");
    var head = idx >= 0 ? text.slice(0, idx) : text;
    var log = idx >= 0 ? text.slice(idx + 9) : "";
    var map = {}, params = [];
    head.split("\n").forEach(function (line) {
      line = line.trim();
      if (!line) return;
      var i = line.indexOf("=");
      if (i < 0) return;
      var k = line.slice(0, i), v = line.slice(i + 1);
      if (k.indexOf("param.") === 0) params.push(k.slice(6) + " = " + v);
      else map[k] = v;
    });
    return { map: map, params: params, log: log.trim() };
  }

  function setBadge(id, text, cls) {
    var el = document.getElementById(id);
    el.textContent = text;
    el.className = "badge" + (cls ? " " + cls : "");
  }

  function render(text) {
    var d = parse(text || "");
    var m = d.map;

    var loaded = m.loaded === "1";
    var blocked = m.blocked === "1";
    var oplus = m.oplus === "1";

    setBadge("state", loaded ? "已加载" : (blocked ? "已阻断" : "未加载"),
             loaded ? "on" : (blocked ? "warn" : "off"));
    setBadge("oplus", oplus ? "是" : "否", oplus ? "on" : "");
    setBadge("compat", m.compat === "1" ? "已加载" : (oplus ? "未加载" : "不需要"),
             m.compat === "1" ? "on" : "");
    setBadge("blocked", blocked ? "是（上次 insmod 崩溃）" : "否", blocked ? "warn" : "on");

    document.getElementById("kernel").textContent = m.kernel || "–";
    document.getElementById("kmi").textContent = m.kmi || "–";
    document.getElementById("device").textContent = (m.brand || "?") + " " + (m.model || "");
    document.getElementById("sub").textContent =
      (m.version ? m.version + " · " : "") + "droid_lkm · " + (m.manager || "");

    document.getElementById("params").textContent = d.params.length ? d.params.join("\n") : "（模块未加载）";
    document.getElementById("log").textContent = d.log || "（空）";
  }

  function setBusy(on) {
    busy = on;
    ["btn-refresh", "btn-load", "btn-log"].forEach(function (id) {
      document.getElementById(id).disabled = on;
    });
  }

  function loadStatus() {
    if (busy) return;
    setBusy(true);
    sh(CMD_STATUS).then(function (r) {
      setBusy(false);
      if (r.errno !== 0 && !r.stdout) {
        document.getElementById("log").textContent = "读取失败 (errno " + r.errno + ")\n" + (r.stderr || "");
        return;
      }
      render(r.stdout);
    });
  }

  document.getElementById("btn-refresh").onclick = loadStatus;

  document.getElementById("btn-load").onclick = function () {
    if (busy) return;
    setBusy(true);
    document.getElementById("log").textContent = "解除阻断并重新加载 …";
    sh("rm -f " + M + "/blocked " + M + "/insmod.crash; sh " + M + "/service.sh").then(function () {
      loadStatus();
    });
  };

  document.getElementById("btn-log").onclick = function () {
    if (busy) return;
    setBusy(true);
    sh(": > " + M + "/phdroid.log").then(function () { loadStatus(); });
  };

  loadStatus();
})();
</script>
</body>
</html>
