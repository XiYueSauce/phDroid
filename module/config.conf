# phDroid 运行参数
# 修改后重启生效；也可以在 WebUI 里点“重试加载”
# 注意：参数只在 insmod 那一刻读一次，ko 已经加载时重试不会重新读
# 取值只有 0/1 的项不要写其它内容，非法值会退回默认值

# ---- droid_lkm.ko ------------------------------------------------------
# 打印每个 hook 入口，排障用，正常保持 0
verbose=0

# 1 = 只服务 droidspaces 进程（宿主机保持原厂 EINVAL/ENOSYS）
# 0 = 全部进程都拿到命名空间能力
gate=0

# POSIX mqueue（mqueuefs + 6 个系统调用）
mqueue=1

# 补 /proc/<pid>/status 里被内核裁掉的 NStgid/NSpid/NSpgid/NSsid
nspid=1
# 1 = 追加到 status 末尾，0 = 插在 task_state 打印的位置
nspid_append=1

# 不接管 SysV IPC 的 18 个系统调用槽位（6 个 mqueue + 12 个 SysV）
skip_sysvipc=0

# 诊断项：unshare() 假装成功但不挂载命名空间
no_fake_ns=0

# 诊断项：不注册 do_exit kprobe
skip_do_exit=0

# 1 = 安装 inline hook；0 = 只保留 kprobe / 系统调用表路径
inline_hook=1

# 0 = 用内核自带的 patch 原语（默认，最稳）
# 1 = 用模块自己算的 fixmap 写路径，只在复现 MTK 崩溃时打开
write_path=0

# 1 = 关键 hook 装不上也继续加载（降级运行）
degrade=0

# insmod 被 SELinux 以 EPERM 拒绝时，用当前域和 ko 的真实上下文
# 拼一条 allow <domain> <type>:system module_load 再重试一次
# 只在设备上有 magiskpolicy（Magisk）时生效；关掉填 0
selinux_fix=1

# ---- droid_lkm_compat.ko ----------------------------------------------
# OPPO / OnePlus / realme 的 vendor 模块会无检查地使用 find_task_by_vpid，
# 并用 p->pid 索引数组，容器内的 pid 会让它们空指针或越界
# auto = 按品牌自动决定；on / off 强制开关
compat=auto

# ghost=1 时给这类调用者返回一个 pid 受限的替代 task
ghost=1

# 按调用方模块名前缀匹配，* 匹配全部
ghost_match=oplus_

# vendor 的 pid 索引表容量：0 = 仅在检测到 pid 索引型 vendor 模块时封顶
# -1 = 从不封顶；N = 封顶到 N
pid_max_cap=0

# ---- 安装期覆盖 --------------------------------------------------------
# 强制指定要安装的 KMI（例如 android16-6.12），一般留空
# 只在自动识别出错时用（例如 recovery 里刷入，uname -r 是 recovery 内核）
# 安装时会按它挑 ko，改完必须重装模块才生效
# kmi_override=
